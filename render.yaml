services:
  - type: web
    name: shop-platform
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: "echo 'No build dependencies needed'"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: ./shop.db
